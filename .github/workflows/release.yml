name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions: {}

jobs:
  release:
    name: Keylessly attest and publish distribution
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: spice-framework/.github/.github/workflows/go-distribution-release.yml@3bf54b986b68d386a90e418776b35ca08f234d20
    with:
      module: github.com/spice-framework/spice-agent-coding
      workflow_commit: 3bf54b986b68d386a90e418776b35ca08f234d20
