name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions: {}

jobs:
  release:
    name: Keylessly attest and publish distribution
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: spice-framework/.github/.github/workflows/go-distribution-release.yml@7f41a3ca854d05dca532eb8fc9a1a9a8315ee55c
    with:
      module: github.com/spice-framework/spice-agent-coding
      workflow_commit: 7f41a3ca854d05dca532eb8fc9a1a9a8315ee55c
