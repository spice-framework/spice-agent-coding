name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions: {}

jobs:
  release:
    name: Keylessly attest and publish distribution
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: spice-framework/.github/.github/workflows/go-distribution-release.yml@6a0ba9f430304c33bf897f4e2d3f393926f42eb9
    with:
      module: github.com/spice-framework/spice-agent-coding
      workflow_commit: 6a0ba9f430304c33bf897f4e2d3f393926f42eb9
