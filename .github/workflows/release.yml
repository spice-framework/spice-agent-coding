name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions: {}

jobs:
  release:
    name: Keylessly attest and publish distribution
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: spice-framework/.github/.github/workflows/go-distribution-release.yml@fd2c3bef36eebff51796bedf96cfd6d775343d52
    with:
      module: github.com/spice-framework/spice-agent-coding
      workflow_commit: fd2c3bef36eebff51796bedf96cfd6d775343d52
